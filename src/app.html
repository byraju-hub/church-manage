<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<!-- 휴대폰에서 화면이 확대·이동되지 않도록 고정 -->
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
		<meta name="theme-color" content="#ffffff" />
		<meta name="text-scale" content="scale" />
		<!-- 글꼴: 본문 Noto Sans KR, 제목(상단 교회 이름 · 대시보드 현황) 고운바탕 (Google Fonts) -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Gowun+Batang:wght@700&family=Gowun+Dodum&display=swap" rel="stylesheet" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
